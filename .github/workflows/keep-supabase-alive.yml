name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping to Supabase RPC
        run: |
          curl -i -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/get_household" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"p_code": "PING-000", "p_client_key": "github-actions-ping"}'
